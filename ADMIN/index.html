<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Administración</title>

    <style>

        body {

            margin: 0;

            font-family: Arial;

            background: #111827;

            color: white;

        }

        header {

            padding: 25px;

            background: #020617;

        }

        main {

            max-width: 1200px;

            margin: auto;

            padding: 30px;

        }

        .estadisticas {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;

        }

        .card {

            background: #1f2937;

            padding: 25px;

            border-radius: 10px;

        }

        .numero {

            font-size: 35px;

            font-weight: bold;

        }

        table {

            width: 100%;

            margin-top: 30px;

            border-collapse: collapse;

            background: white;

            color: black;

        }

        th,
        td {

            padding: 15px;

            border-bottom: 1px solid #ddd;

            text-align: left;

        }

        button {

            background: #dc2626;

            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;

        }

    </style>

</head>


<body>


<header>

    <h1>🛠️ Administración</h1>

</header>


<main>


    <div class="estadisticas">


        <div class="card">

            <h3>Productos</h3>

            <div
                class="numero"
                id="totalProductos">

                0

            </div>

        </div>


        <div class="card">

            <h3>Tiendas</h3>

            <div
                class="numero"
                id="totalTiendas">

                0

            </div>

        </div>


    </div>


    <h2>Productos registrados</h2>


    <table>

        <thead>

            <tr>

                <th>ID</th>

                <th>Producto</th>

                <th>Tienda</th>

                <th>Precio</th>

                <th>Acción</th>

            </tr>

        </thead>


        <tbody
            id="tablaProductos">
        </tbody>

    </table>


</main>


<script>

const API =
    "http://localhost:4000";


async function cargarDatos() {


    const productosRespuesta =
        await fetch(
            `${API}/api/productos`
        );


    const productos =
        await productosRespuesta.json();


    const tiendasRespuesta =
        await fetch(
            `${API}/api/tiendas`
        );


    const tiendas =
        await tiendasRespuesta.json();


    document
        .getElementById(
            "totalProductos"
        )
        .textContent =
        productos.length;


    document
        .getElementById(
            "totalTiendas"
        )
        .textContent =
        tiendas.length;


    const tabla =
        document.getElementById(
            "tablaProductos"
        );


    tabla.innerHTML = "";


    productos.forEach(producto => {


        const fila =
            document.createElement("tr");


        fila.innerHTML = `

            <td>
                ${producto.id}
            </td>

            <td>
                ${producto.nombre}
            </td>

            <td>
                ${producto.tienda}
            </td>

            <td>
                ${producto.precio} XAF
            </td>

            <td>

                <button
                    onclick="eliminarProducto(${producto.id})">

                    Eliminar

                </button>

            </td>

        `;


        tabla.appendChild(fila);

    });

}


async function eliminarProducto(id) {


    const confirmar =
        confirm(
            "¿Quieres eliminar este producto?"
        );


    if (!confirmar) {
        return;
    }


    await fetch(
        `${API}/api/productos/${id}`,
        {
            method: "DELETE"
        }
    );


    cargarDatos();

}


cargarDatos();

</script>


</body>

</html>
